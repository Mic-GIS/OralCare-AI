<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OralCare AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js library to convert Markdown from n8n into styled HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div class="app">

    <header class="header">
        <button class="menu-button">☰</button>
        <h2>OralCare AI</h2>
        <button class="drop-button">˅</button>
    </header>

    <main id="chatArea">
        <div id="welcome" class="welcome">
            <h1>How can I help you?</h1>
            <p>Ask me anything about oral hygiene.</p>
        </div>
    </main>

    <div class="bottom">
        <div class="input-container">
            <button id="plusButton">+</button>
            <input id="messageInput" type="text" placeholder="Type a message">
            <button id="sendButton">➤</button>
        </div>

        <div class="quick-buttons">
            <button data-message="Teach me the correct way to brush my teeth.">
                🦷 Brushing
            </button>
            <button data-message="How can I keep my gums healthy?">
                🩸 Gum Health
            </button>
            <button data-message="Explain how cavities develop.">
                🦷 Cavities
            </button>
            <button data-message="What causes bad breath?">
                😮 Bad Breath
            </button>
        </div>
    </div>

    <footer>
        OralCare AI • Educational information only
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
